[project]
name = "PoseSense"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch==2.12.1",
    "torchvision==0.27.1",
    "ultralytics",
    "numpy",
    "opencv-python",
    "triton-windows==3.7.1.post27",
    "lap==0.5.13",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
